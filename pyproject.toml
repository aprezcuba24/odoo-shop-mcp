[project]
name = "apk-mcp"
version = "0.1.0"
description = "MCP server bridging ChatGPT/Cursor to Tienda Apk order_bridge REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=24.2.0",
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
apk-mcp = "apk_mcp.__main__:main"
apk-mcp-shop-key = "apk_mcp.cli.shop_key:main"

[project.optional-dependencies]
lambda = ["mangum>=0.19.0", "boto3>=1.34.0"]

[dependency-groups]
dev = [
    "datamodel-code-generator[http]>=0.57.0",
    "openapi-python-client>=0.28.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
